<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فني كهربائي محترف | تأسيس وتشطيب</title>
    <style>
        :root { --primary-color: #007bff; --whatsapp-color: #25d366; }
        body { font-family: 'Tahoma', sans-serif; background-color: #f4f4f4; margin: 0; padding-bottom: 60px; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .slider-container { position: relative; width: 100%; height: 220px; overflow: hidden; }
        .slide-img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease-in-out; }
        .slide-img.active { opacity: 1; }
        .content { padding: 15px; text-align: center; }
        .btn { display: block; background: var(--primary-color); color: white; padding: 10px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="services-grid">
        
        <!-- قسم 1: تأسيس البنية التحتية -->
        <div class="service-card">
            <div class="slider-container">
                <img src="https://images.unsplash.com/photo-1544627884-633044a2c589?w=600" class="slide-img active">
                <img src="https://images.unsplash.com/photo-1596495543069-1748231c6204?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600" class="slide-img">
            </div>
            <div class="content"><h3>تأسيس الكهرباء</h3><a href="tel:01221404746" class="btn">اتصل الآن</a></div>
        </div>

        <!-- قسم 2: لوحات التوزيع والقواطع -->
        <div class="service-card">
            <div class="slider-container">
                <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=600" class="slide-img active">
                <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1621905252507-b35492cc74b4?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=600" class="slide-img">
            </div>
            <div class="content"><h3>لوحات التوزيع</h3><a href="tel:01221404746" class="btn">اتصل الآن</a></div>
        </div>

        <!-- قسم 3: تركيب الإضاءة والنجف -->
        <div class="service-card">
            <div class="slider-container">
                <img src="https://images.unsplash.com/photo-1540932239986-30128078f3c5?w=600" class="slide-img active">
                <img src="https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1565183997392-2f6f122e5912?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=600" class="slide-img">
            </div>
            <div class="content"><h3>إضاءة وديكور</h3><a href="tel:01221404746" class="btn">اتصل الآن</a></div>
        </div>

        <!-- قسم 4: أدوات القياس والفحص -->
        <div class="service-card">
            <div class="slider-container">
                <img src="https://images.unsplash.com/photo-1517420704952-d9f39e95b43e?w=600" class="slide-img active">
                <img src="https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1541888946425-d0fbb18fefbc?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1513828583688-c52646db42da?w=600" class="slide-img">
            </div>

        </div>

        <!-- قسم 5: تشطيبات المفاتيح والأفياش -->
        <div class="service-card">
            <div class="slider-container">
                <img src="https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=600" class="slide-img active">
                <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600" class="slide-img">
                <img src="https://images.unsplash.com/photo-1557597774-9d273605dfa9?w=600" class="slide-img">

        <!-- قسم 6: تمديدات داخل الجدران -->

                <img src="https://images.unsplash.com/photo-1508873696983-2df5c92064c8?w=600" class="slide-img">

                <img src="https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=600" class="slide-img">

            </div>

        </div>

    </div>
</div>

<script>
    document.querySelectorAll('.slider-container').forEach(slider => {
        let slides = slider.querySelectorAll('.slide-img');
        let i = 0;
        setInterval(() => {
            slides[i].classList.remove('active');
            i = (i + 1) % slides.length;
            slides[i].classList.add('active');
        }, 1000);
    });
</script>

</body>
</html>
